<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Special+Gothic+Expanded+One&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container-fliud">

        <div class="row main_header_div">

            <div class="header_left_side">

                <div class="page_logo_div">

                    <img src="assets/img/logo.png">

                    <label for="">Weather Forecast</label>

                </div>

                <div class="page_title_div">


                </div>

            </div>

            <div class="header_right_side">

                <input type="text" placeholder="Search Weather">

            </div>

        </div>

    </div>


    <div class="weather_card">

        <div class="weather_left_side">

            <div class="current_weather">
                <div class="weather_icon">
                    <img src="assets/img/current-weather.png" alt="current-weather_image">
                </div>

                <div class="weather_details">

                    <div class="location">
                        Colombo, Sri Lanka
                    </div>

                    <div class="temperature">
                        28°C
                    </div>

                    <div class="condition">
                        Light Rain
                    </div>

                    <div class="date">
                        Sunday, November 16, 2025
                    </div>

                </div>
            </div>


            <div class="sun_times">

                <div class="sun_rise">
                    <div class="sun_rise_image">
                        <img src="assets/img/sun-rise.png">

                    </div>
                    <div>Sun Rise</div>
                    <div>05:57 AM</div>
                </div>

                <div class="sun_set">

                    <div class="sun_set_image">

                        <img src="assets/img/sun-set.png">
                    </div>

                    <div>Sun Set</div>
                    <div>05:46 PM</div>

                </div>

            </div>

        </div>

        <div class="weather_right_side">

            <div class="stat_item">
                <svg class="stat_icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12.5 2.5C12.5 5.5 14.5 7.5 17.5 7.5C20.5 7.5 22.5 5.5 22.5 2.5M17.5 7.5V11.5M1.5 7.5H17.5M1.5 11.5H14.5C14.5 14.5 16.5 16.5 19.5 16.5C22.5 16.5 24.5 14.5 24.5 11.5M1.5 16.5H19.5"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="stat_text">
                    <div class="stat_title">Wind Speed</div>
                    <div class="stat_value">3 km/h</div>
                </div>
            </div>

            <div class="stat_item">
                <svg class="stat_icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2.69127C12 2.69127 5.63636 10.3636 5.63636 14.7273C5.63636 19.0909 8.45455 22 12 22C15.5455 22 18.3636 19.0909 18.3636 14.7273C18.3636 10.3636 12 2.69127Z"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="stat_text">
                    <div class="stat_title">Humidity</div>
                    <div class="stat_value">98%</div>
                </div>
            </div>

            <div class="stat_item">
                <svg class="stat_icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17.5 19.0002C19.4891 19.0002 21.088 17.6577 21.4312 15.822C23.0645 14.685 23.5188 12.5857 22.422 10.9141C21.3252 9.2425 19.105 8.97034 17.2605 9.94077C16.347 6.43423 13.0802 4 9.5 4C5.59681 4 2.44634 7.23485 2.05221 11.1082C0.47998 11.8384 -0.341162 13.6826 0.174823 15.3973C0.690808 17.112 2.30218 18.1754 4 18.0002"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="stat_text">
                    <div class="stat_title">Cloud Cover</div>
                    <div class="stat_value">100%</div>
                </div>
            </div>

            <div class="stat_item">
                <svg class="stat_icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18ZM12 22V20M12 4V2M20 12H22M2 12H4M19.071 4.92893L17.6568 6.34315M6.34315 17.6568L4.92893 19.071M19.071 19.071L17.6568 17.6568M6.34315 6.34315L4.92893 4.92893"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="stat_text">
                    <div class="stat_title">UV Index</div>
                    <div class="stat_value">0 (Low)</div>
                </div>
            </div>

            <div class="stat_item">
                <svg class="stat_icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 12A9.5 9.5 0 1 1 12 2.5a9.5 9.5 0 0 1 9.5 9.5Z" />
                    <path d="M12 12 16 8" />
                    <path d="M12 2v4" />
                    <path d="m4.93 4.93 2.83 2.83" />
                    <path d="m16.24 16.24 2.83 2.83" />
                    <path d="M4.93 19.07 7.76 16.24" />
                </svg>
                <div class="stat_text">
                    <div class="stat_title">Pressure</div>
                    <div class="stat_value">1016hPa</div>
                </div>
            </div>

            <div class="stat_item">
                <svg class="stat_icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M2.47644 12C3.6961 7.00974 7.51206 3.5 12.0002 3.5C16.4884 3.5 20.3044 7.00974 21.5241 12C20.3044 16.9903 16.4884 20.5 12.0002 20.5C7.51206 20.5 3.6961 16.9903 2.47644 12ZM12.0002 15C13.6569 15 15.0002 13.6569 15.0002 12C15.0002 10.3431 13.6569 9 12.0002 9C10.3434 9 9.0002 10.3431 9.0002 12C9.0002 13.6569 10.3434 15 12.0002 15Z"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="stat_text">
                    <div class="stat_title">Visibility</div>
                    <div class="stat_value">0 km</div>
                </div>
            </div>

        </div>

    </div>

    <script src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
